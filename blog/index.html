<!DOCTYPE html>

<head>

<style>:root{
  --c:#1F4A47;--c2:#143331;--apoio:#1F4A47;
  --acento:#1F4A47;--acento-cl:#1F4A4714;
  --fundo:#F6F0E6;--neutro:#F6F0E6;
  --tinta:#1E2B29;--suave:#4F5D59;
  --linha:rgba(30,43,41,.14);--shadow:0 18px 40px -22px rgba(20,51,49,.35);
  --r:14px;--serif:'Literata', Georgia, serif;--sans:'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
  --maxw:1160px;--gut:clamp(1.25rem,4vw,2.5rem);--sec-y:clamp(3rem,6vw,5rem);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--sans);font-size:1.0625rem;line-height:1.75;color:var(--tinta);background:var(--fundo);overflow-x:hidden}
img{max-width:100%;display:block;height:auto}a{color:inherit;text-decoration:none}
ul,ol{margin:0;padding:0;list-style:none}h1,h2,h3,h4{margin:0;line-height:1.15;font-weight:600}p{margin:0 0 1rem}
.serif{font-family:var(--serif)}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding-inline:var(--gut)}

/* -- Filete com nó (igual ao site) -- */
.rule{position:relative;border:0;height:18px;
  width:min(var(--maxw),calc(100% - 2*var(--gut)));margin:0 auto;
  background:linear-gradient(90deg,transparent,var(--linha) 22%,var(--linha) 78%,transparent) center/100% 1px no-repeat}
.rule::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;
  background:var(--c);box-shadow:0 0 0 4px var(--fundo);transform:translate(-50%,-50%) rotate(45deg)}

/* -- Header -- */
.site-head{position:sticky;top:0;z-index:100;
  background:rgba(251,246,242,.0);backdrop-filter:none;
  transition:background .3s,box-shadow .3s,padding .3s;padding:.9rem 0}
.site-head.scrolled{background:rgba(251,246,242,.93);backdrop-filter:saturate(140%) blur(10px);
  box-shadow:0 1px 0 var(--linha);padding:.55rem 0}
.head__inner{display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:inline-flex;align-items:center;gap:.7rem}
.brand__icon{width:40px;height:40px;object-fit:contain;transition:width .3s,height .3s}
.site-head.scrolled .brand__icon{width:34px;height:34px}
.brand__logo{height:46px;width:auto;object-fit:contain;transition:height .3s}
.site-head.scrolled .brand__logo{height:38px}
.brand__text{display:flex;flex-direction:column;line-height:1.05}
.brand__name{font-family:var(--serif);font-size:1.35rem;font-weight:600;color:var(--c)}
.brand__sub{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--suave)}
.head-nav{display:flex;align-items:center;gap:1.8rem;flex-wrap:nowrap}
.head-nav a:not(.btn-wpp){font-size:.9rem;font-weight:500;color:var(--tinta);position:relative;padding:.2rem 0;flex-shrink:0;white-space:nowrap}
.head-nav a:not(.btn-wpp)::after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1.5px;background:var(--c);transition:width .25s}
.head-nav a:not(.btn-wpp):hover{color:var(--c)}.head-nav a:not(.btn-wpp):hover::after{width:100%}
.btn-wpp{display:inline-flex;align-items:center;gap:.45rem;font-size:.875rem;font-weight:600;
  padding:.6rem 1.2rem;border-radius:var(--r);background:var(--c);color:#fff;min-height:40px;
  flex-shrink:0;white-space:nowrap;transition:background .2s,transform .2s}
.btn-wpp:hover{background:var(--c2);transform:translateY(-1px)}

/* -- Eyebrow / índice de seção -- */
.eyebrow{font-family:var(--sans);font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;
  font-weight:600;color:var(--acento);display:block;margin-bottom:.4rem}

/* -- Hero do blog -- */
.blog-hero{padding:clamp(5rem,10vw,7rem) 0 clamp(2rem,4vw,3rem)}
.blog-hero h1{font-family:var(--serif);font-size:clamp(2.8rem,8vw,5rem);color:var(--c);margin-bottom:.6rem}
.blog-hero p{font-family:var(--serif);font-style:italic;font-size:clamp(1.2rem,2.4vw,1.6rem);
  color:var(--suave);max-width:56ch;margin:0}

/* -- Lista editorial de artigos -- */
.art-list{border-top:1px solid var(--linha);margin-top:clamp(2rem,5vw,3.5rem)}
.art-list__item{display:grid;grid-template-columns:1fr auto;gap:1.2rem 2.5rem;
  padding:1.8rem 0;border-bottom:1px solid var(--linha);align-items:start;
  transition:background .2s}
.art-list__item:hover .art-list__title{color:var(--c2)}
.art-list__meta{font-size:.82rem;color:var(--suave);letter-spacing:.04em;margin-bottom:.55rem;
  display:flex;gap:1rem;align-items:center}
.art-list__title{font-family:var(--serif);font-size:clamp(1.35rem,2.6vw,1.85rem);font-weight:600;
  color:var(--c);margin-bottom:.45rem;transition:color .2s;line-height:1.15}
.art-list__excerpt{color:var(--suave);font-size:.98rem;max-width:70ch;margin:0}
.art-list__cover{width:clamp(100px,16vw,170px);aspect-ratio:3/2;object-fit:cover;
  border-radius:var(--r);flex-shrink:0;box-shadow:var(--shadow)}
.art-list__cover-ph{width:clamp(100px,16vw,170px);aspect-ratio:3/2;
  background:var(--acento-cl);border-radius:var(--r);border:1.5px solid var(--linha)}
.art-list__read{display:inline-flex;align-items:center;gap:.3rem;font-size:.85rem;
  font-weight:600;color:var(--c);margin-top:.8rem}
.art-list__read::after{content:'→';transition:transform .2s}
.art-list__item:hover .art-list__read::after{transform:translateX(4px)}

/* -- Destaque (1º artigo) -- */
.feat{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,4vw,4rem);
  align-items:center;padding:clamp(2rem,5vw,3.5rem) 0;border-bottom:1px solid var(--linha)}
.feat__body .eyebrow{color:var(--acento)}
.feat__title{font-family:var(--serif);font-size:clamp(1.8rem,4vw,2.8rem);color:var(--c);
  margin:.4rem 0 .8rem;line-height:1.12}
.feat__body p{color:var(--suave);font-size:1.02rem;max-width:52ch}
.feat__meta{font-size:.82rem;color:var(--suave);margin-top:.8rem;display:flex;gap:1rem}
.feat__read{display:inline-flex;align-items:center;gap:.3rem;font-weight:600;color:var(--c);
  margin-top:1rem;font-size:.9rem}
.feat__read::after{content:'→';transition:transform .2s}
.feat:hover .feat__read::after{transform:translateX(4px)}

/* Moldura editorial offset (igual ao site) */
.offset-frame{position:relative}
.offset-frame::before{content:'';position:absolute;inset:0;
  border:1.5px solid var(--c);border-radius:var(--r);
  transform:translate(14px,14px);z-index:0;transition:transform .4s}
.offset-frame img{position:relative;z-index:1;border-radius:var(--r);
  box-shadow:var(--shadow);width:100%;object-fit:cover;aspect-ratio:4/3}
.feat:hover .offset-frame::before{transform:translate(8px,8px)}
.offset-frame--ph{position:relative}
.offset-frame--ph::before{content:'';position:absolute;inset:0;
  border:1.5px solid var(--linha);border-radius:var(--r);transform:translate(14px,14px)}
.offset-frame--ph .ph{background:var(--acento-cl);border-radius:var(--r);
  aspect-ratio:4/3;width:100%;position:relative;z-index:1}

/* -- Grade de cards (índice) -- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:clamp(1.5rem,3vw,2.2rem);margin:clamp(2rem,5vw,3.2rem) 0 clamp(3rem,6vw,5rem)}
.card{background:#fff;border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 10px 30px -22px rgba(0,0,0,.4);
  transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 22px 44px -26px rgba(0,0,0,.45)}
.card__cover{aspect-ratio:3/2;overflow:hidden}
.card__cover img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .card__cover img{transform:scale(1.04)}
.card__cover--ph{aspect-ratio:3/2;background:var(--acento-cl)}
.card__body{padding:1.3rem 1.4rem 1.5rem;display:flex;flex-direction:column;flex:1}
.card__meta{font-size:.78rem;color:var(--suave);letter-spacing:.04em;
  display:flex;gap:.9rem;margin-bottom:.6rem}
.card__title{font-family:var(--serif);font-size:1.3rem;line-height:1.2;color:var(--c);
  margin-bottom:.55rem;transition:color .2s}
.card:hover .card__title{color:var(--c2)}
.card__excerpt{color:var(--suave);font-size:.95rem;margin:0 0 1rem;flex:1}
.card__read{display:inline-flex;align-items:center;gap:.3rem;font-size:.85rem;
  font-weight:600;color:var(--c)}
.card__read::after{content:'→';transition:transform .2s}
.card:hover .card__read::after{transform:translateX(4px)}

/* -- Artigo completo -- */
.art-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:clamp(2.5rem,5vw,5rem);
  margin:clamp(2.5rem,5vw,4rem) 0}
.art-main{}
.art-back{display:inline-flex;align-items:center;gap:.4rem;font-size:.88rem;font-weight:600;
  color:var(--suave);margin-bottom:1.8rem;transition:color .2s}
.art-back:hover{color:var(--c)}
.art-back::before{content:'←'}
.art-eyebrow{margin-bottom:.6rem}
.art-title{font-family:var(--serif);font-size:clamp(2.2rem,6vw,3.8rem);color:var(--c);
  margin:.2rem 0 1.2rem;line-height:1.1}
.art-meta{display:flex;gap:1.2rem;align-items:center;font-size:.83rem;color:var(--suave);
  padding-bottom:1.4rem;border-bottom:1px solid var(--linha);margin-bottom:1.6rem;flex-wrap:wrap}
.art-meta span{display:flex;align-items:center;gap:.3rem}

/* Pullquote (excerto destacado) */
.pullquote{border-left:3px solid var(--c);padding-left:clamp(1.2rem,3vw,2rem);
  margin:0 0 1.8rem;max-width:72ch}
.pullquote p{font-family:var(--serif);font-style:italic;
  font-size:clamp(1.25rem,2.6vw,1.7rem);line-height:1.35;color:var(--c);margin:0}

.art-cover{width:100%;border-radius:var(--r);margin:1.6rem 0;
  object-fit:cover;max-height:440px;box-shadow:var(--shadow)}

/* TOC */
.toc{background:#fff;border:1px solid var(--linha);border-radius:var(--r);
  padding:1.4rem 1.6rem;margin-bottom:1.6rem}
.toc__title{font-family:var(--sans);font-size:.75rem;letter-spacing:.18em;
  text-transform:uppercase;color:var(--suave);font-weight:600;margin-bottom:.8rem;display:block}
.toc ul{list-style:none;margin:0;padding:0}
.toc li{margin:.45rem 0}
.toc li.n2{padding-left:1.1rem}
.toc a{font-size:.9rem;color:var(--suave);font-family:var(--sans);transition:color .2s}
.toc a:hover{color:var(--c)}

/* Corpo do texto */
.body-text p{font-size:1.06rem;margin:0 0 1.3rem;color:var(--tinta)}
.body-text h2{font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.2rem);color:var(--c);
  margin:2.4rem 0 .9rem}
.body-text h3{font-family:var(--serif);font-size:clamp(1.2rem,2.2vw,1.6rem);color:var(--c);
  margin:2rem 0 .7rem}
.body-text ul,.body-text ol{padding-left:1.5rem;margin:0 0 1.3rem}
.body-text li{margin-bottom:.5rem;font-size:1.03rem}
.body-text blockquote{background:var(--acento-cl);border:0;border-radius:var(--r);text-align:center;
  padding:clamp(1.4rem,3vw,2.2rem) clamp(1.4rem,4vw,3rem);margin:2.2rem 0;
  font-family:var(--serif);font-size:clamp(1.15rem,2.2vw,1.5rem);line-height:1.4;color:var(--c)}
.body-text blockquote p{margin:0;font-style:normal;color:inherit;font-size:inherit;font-family:inherit}

/* Compartilhar */
.share{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--linha);margin-top:2.8rem;padding-top:1.6rem}
.share__label{font-size:.85rem;color:var(--suave);font-family:var(--sans);font-weight:600;
  letter-spacing:.06em;text-transform:uppercase}
.share a{border:1.5px solid var(--linha);border-radius:var(--r);padding:.5rem 1rem;
  font-size:.85rem;font-family:var(--sans);font-weight:500;color:var(--suave);transition:border-color .2s,color .2s}
.share a:hover{border-color:var(--c);color:var(--c)}

/* Artigos relacionados */
.rel-title{font-family:var(--serif);font-size:clamp(1.5rem,3vw,2rem);color:var(--c);
  margin:3rem 0 0}

/* Aside / sticky */
.aside{position:sticky;top:5rem;align-self:start;display:flex;flex-direction:column;gap:1.2rem}
.cta-card{background:#fff;border:1px solid var(--linha);border-radius:var(--r);
  padding:1.6rem;box-shadow:0 20px 50px -30px rgba(92,26,36,.35)}
.cta-card h4{font-family:var(--serif);font-size:1.35rem;color:var(--c);margin-bottom:.5rem}
.cta-card p{font-size:.93rem;color:var(--suave);margin-bottom:1rem}
.btn-cta{display:flex;align-items:center;justify-content:center;gap:.5rem;
  width:100%;padding:.85rem 1rem;border-radius:var(--r);
  background:var(--c);color:#fff;font-family:var(--sans);font-weight:600;font-size:.92rem;
  border:0;cursor:pointer;transition:background .2s,transform .2s}
.btn-cta:hover{background:var(--c2);transform:translateY(-1px)}

/* -- Vazio -- */
.empty{text-align:center;padding:clamp(4rem,8vw,7rem) 0;color:var(--suave);font-size:1.05rem}
.empty strong{display:block;font-family:var(--serif);font-size:clamp(1.5rem,4vw,2.5rem);
  color:var(--c);margin-bottom:.8rem}

/* -- Footer -- */
.site-foot{background:var(--c2);color:rgba(251,246,242,.8);margin-top:clamp(4rem,8vw,6rem)}
.foot-inner{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
  gap:.8rem;padding:1.8rem 0;font-size:.85rem;font-family:var(--sans)}
.foot-inner a{color:rgba(251,246,242,.75);text-decoration:underline;text-underline-offset:2px}
.foot-inner a:hover{color:#fff}

/* -- Responsivo -- */
@media(max-width:900px){
  .art-wrap{grid-template-columns:1fr}
  .aside{position:static}
  .feat{grid-template-columns:1fr}
  .art-list__item{grid-template-columns:1fr}
  .art-list__cover,.art-list__cover-ph{display:none}
}
@media(max-width:860px){
  .head-nav .btn-wpp{display:none}
}
@media(max-width:640px){
  .head-nav{gap:1.2rem}
  .feat__title{font-size:1.6rem}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}</style>
</head>
